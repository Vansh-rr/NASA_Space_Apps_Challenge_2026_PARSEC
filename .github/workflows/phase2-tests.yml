# runs Phase 2 engineering and algorithm offline tests on GitHub every time someone pushes to code or main
name: Phase 2 tests

on:
  push:
    branches: [code, main]
  pull_request:
    branches: [code, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python phase2_test.py

