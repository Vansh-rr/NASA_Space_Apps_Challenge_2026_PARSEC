name: Repository checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: firesync-app/package-lock.json
      - name: Run the complete offline suite
        run: python run_tests.py --install
      - name: Save results even after a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
